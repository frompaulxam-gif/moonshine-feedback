.merchants-yard .shade{background:linear-gradient(180deg,rgba(18,23,14,.67),rgba(20,25,15,.04) 29%,rgba(18,24,12,.13) 44%,rgba(19,23,13,.87) 76%,#171c13)}
.mast,.letter{margin:clamp(30px,5vw,80px)}.mark{width:clamp(133px,15vw,215px);height:auto;max-height:80px;object-fit:contain;object-position:left}.letter{max-width:560px}
.eyebrow,.progress{font:600 11px/1.4 Body,Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}
.eyebrow{margin:0 0 15px}.letter h1,h2{font-family:Display,Georgia,serif;font-weight:400;letter-spacing:-.025em;line-height:1.04;margin:0}
h1{font-size:clamp(52px,6vw,103px);text-wrap:balance}.merchants-yard h1{font-size:clamp(46px,5.3vw,82px)}
.intro{line-height:1.6;max-width:40ch;margin:20px 0 0;color:#fff8ef}
.sheet{display:flex;align-items:center;justify-content:center;padding:clamp(30px,5vw,80px)}
.inner{width:100%;max-width:555px}.progress{display:flex;align-items:center;justify-content:space-between;color:var(--accent);margin-bottom:34px;gap:16px}
#track{display:flex;gap:4px;width:38%}#track i{height:3px;flex:1;background:var(--border)}#track .filled{background:var(--accent)}
fieldset{border:0;padding:0;margin:0;min-width:0}h2{font-size:clamp(33px,3.8vw,56px);text-wrap:balance}.merchants-yard h2{font-size:clamp(29px,3vw,44px);line-height:1.13}
.hint{color:#615d52;margin:13px 0 19px;font-size:14px}.options{display:grid;gap:8px}
.choice{position:relative;display:flex;align-items:center;gap:13px;min-height:46px;border:1px solid var(--border);border-radius:3px;padding:10px 15px;background:rgba(255,255,255,.35);cursor:pointer}
.choice:has(input:checked){background:var(--selected);border-color:var(--accent)}
input{width:17px;height:17px;flex:none;margin:0;accent-color:var(--accent)}textarea{font:inherit;width:100%;min-height:150px;padding:15px;background:#fffdf9;border:1px solid var(--border);border-radius:3px;color:var(--ink);resize:vertical}
.nav{display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--border);margin-top:24px;gap:16px}
button{font:600 15px/1.35 Body,Arial,sans-serif;cursor:pointer;min-height:46px}#next{background:var(--accent);color:white;border:0;border-radius:3px;padding:12px 23px;margin-left:auto}#next span{margin-left:15px}#back{background:none;border:0;color:var(--ink);padding:8px 4px}button:disabled{opacity:.65}.error{color:#8a3023;margin:12px 0 0;font-size:14px}.error:empty{display:none}.preview{border-left:3px solid var(--accent);padding-left:12px;font-size:13px;margin:0 0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}h2:focus{outline:none}
body.moonshine {
  color-scheme: dark;
  --paper: #000;
  --ink: #f7f0e5;
  --accent: #e6baaa;
  --border: #59524d;
  --selected: #34221f;
}
.moonshine .sheet { background: var(--paper); }
.moonshine .hint { color: #c7bcb4; }
.moonshine .choice, .moonshine textarea { background: #141312; }
.moonshine .choice:has(input:checked) { background: var(--selected); }
.moonshine #next { background: #813829; color: #fff8ef; }
.moonshine .error { color: #ffad98; }
@media(max-width:760px){.layout{display:block}.cover{position:relative;height:auto;min-height:296px}.photo{object-position:50% 36%}.merchants-yard .photo{object-position:50% 54%}.mast{margin:19px 24px 0}.mark{width:128px;max-height:43px}.letter{margin:35px 24px 23px}.letter .eyebrow{margin-bottom:6px;font-size:10px}.letter h1{font-size:44px;line-height:1.03}.merchants-yard .letter h1{font-size:36px}.intro{font-size:14px;line-height:1.45;margin:10px 0 0;max-width:50ch}.sheet{padding:24px 23px 36px}.progress{margin-bottom:18px}.hint{margin:9px 0 14px}.compact .cover{min-height:65px;justify-content:center}.compact .letter{display:none}.compact .mast{margin:12px 24px}.compact .shade{background:rgba(22,20,18,.7)}}
</style>

<div class="letter"><p class="eyebrow">Guest feedback</p><h1>A little note after your visit</h1><p class="intro">Thank you for spending some time with us at Moonshine. We’d love to hear what stayed with you afterwards, and what we could do a little better next time.</p></div>

<form id="form" novalidate>

<script type="application/json" id="config">{"brand":"Moonshine Leicester","title":"A little note after your visit","intro":"Thank you for spending some time with us at Moonshine. We’d love to hear what stayed with you afterwards, and what we could do a little better next time.","questions":[{"text":"What brought you to Moonshine on your last visit?","options":["Cocktails or a catch up","Live music","Bottomless brunch","A private party","Something else"]},{"text":"How was your visit overall?","options":["Very poor","Poor","Okay","Good","Excellent"]},{"text":"How did the music volume feel where you were?","options":["Too quiet","About right","Too loud","It varied through the visit","I didn’t notice the music"]},{"text":"What’s one thing you’d like us to keep just as it is?","options":null},{"text":"Where could we make the biggest difference to your next visit?","options":["Booking a table","The welcome","Seating and comfort","The music","The drinks themselves","Time waiting for drinks","Value for money","Something else","Nothing comes to mind"]},{"text":"What would you have liked us to do differently?","options":null}],"slug":"moonshine","submitUrl":"https://leicester-guest-feedback.bestpesto8.chatgpt.site/moonshine/submit"}</script>
<script>const {brand, slug, questions, submitUrl} = JSON.parse(document.querySelector('#config').textContent);
const form = document.querySelector('#form');
const next = document.querySelector('#next');
const back = document.querySelector('#back');
const error = document.querySelector('#error');
const pages = document.querySelector('#pages');
const offline = location.protocol === 'file:';
const notice = document.querySelector('.preview');
const preview = Boolean(notice && (offline || new URLSearchParams(location.search).get('preview') === '1'));
if (notice) {
  notice.hidden = !preview;
  if (offline) notice.textContent = 'HTML preview · Try the form here. Your answers stay on this device.';
}
const id = crypto.randomUUID();
let step = 0;
let busy = false;
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}
questions.forEach((question, index) => {
  const panel = element('fieldset');
  const heading = element('h2', question.text);
  heading.id = 'heading-' + index;
  heading.tabIndex = -1;
  panel.setAttribute('aria-labelledby', heading.id);
  panel.append(heading);
  const instructions = question.options ? (index === 0 ? 'Choose the main reason.' : 'Choose one answer.') : 'Optional · A few words are plenty.';
  panel.append(element('p', instructions, 'hint'));
  if (question.options) {
    const options = element('div', '', 'options');
    for (const label of question.options) {
      const row = element('label', '', 'choice');
      const radio = element('input');
      radio.type = 'radio';
      radio.name = 'q' + index;
      radio.value = label;
      radio.required = true;
      row.append(radio, element('span', label));
      options.append(row);
    }
    panel.append(options);
  } else {
    const field = element('textarea');
    field.name = 'q' + index;
    field.maxLength = 1500;
    field.setAttribute('aria-labelledby', heading.id);
    panel.append(field);
  }
  pages.append(panel);
  document.querySelector('#track').append(element('i'));
});
function showStep(focus) {
  for (const [i, panel] of Array.from(pages.children).entries()) panel.hidden = i !== step;
  document.querySelector('#position').textContent = 'Question ' + (step + 1) + ' of ' + questions.length;
  for (const [i, bar] of Array.from(document.querySelector('#track').children).entries()) bar.classList.toggle('filled', i <= step);
  back.hidden = step === 0;
  next.innerHTML = step === questions.length - 1 ? 'Send feedback <span aria-hidden="true">→</span>' : 'Continue <span aria-hidden="true">→</span>';
  error.textContent = '';
  document.body.classList.toggle('compact', step > 0);
  if (focus) {
    pages.children[step].querySelector('h2').focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}
form.addEventListener('change', () => { error.textContent = ''; });
back.onclick = () => { if (!busy && step > 0) { step--; showStep(true); } };
form.onsubmit = async event => {
  event.preventDefault();
  if (busy) return;
  const fields = new FormData(form);
  if (questions[step].options && !fields.get('q' + step)) {
    error.textContent = 'Choose an answer to continue.';
    pages.children[step].querySelector('input').focus();
    return;
  }
  if (step < questions.length - 1) { step++; showStep(true); return; }
  busy = true;
  back.disabled = next.disabled = true;
  next.textContent = 'Sending…';
  const answers = questions.map((_,i) => (fields.get('q' + i) || '').trim());
  try {
    if (!offline) {
      const result = await fetch(submitUrl || '/' + slug + '/submit', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id, answers, preview})});
      if (!result.ok || (await result.json()).saved !== true) throw new Error();
    }
    form.hidden = true;
    const thanks = document.querySelector('#thanks');
    thanks.hidden = false;
    document.querySelector('#receipt').textContent = offline ? 'You’ve reached the end of the local form. Use the live link to send feedback.' : preview ? 'Your test response has been saved separately from guest feedback.' : 'Your feedback has been received by ' + brand + '.';
    thanks.querySelector('h2').focus();
  } catch {
    next.textContent = 'Try again';
    error.textContent = 'We couldn’t confirm your feedback was saved. Your answers are still here. Please try again.';
  } finally { busy = false; next.disabled = back.disabled = false; }
};
showStep(false);
</script>
